<!doctype html>
<html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ brand }}</title>
<link rel="stylesheet" href="/static/tests.css">
<script type="application/json" id="meta">{{ meta_json | safe }}</script>
<script defer src="/static/test-player.js"></script>
<script defer src="/static/alpine-3.14.1.min.js"></script>
</head>
<body x-data="player()" x-init="init()">
<header><div class="bar">
  <div class="brand" x-text="m.brand"></div>
  <span class="muted" x-text="m.title"></span>
  <span class="timer" :class="left < 300 && 'low'" x-show="phase==='test'" x-text="clock()"></span>
  <button class="btn primary" x-show="phase==='test'" @click="confirmSubmit()" x-text="L.submit"></button>
</div></header>
<main>
  <div class="err" x-show="error" x-text="error"></div>

  <!-- intro / sign-up -->
  <template x-if="phase==='intro'">
    <div class="card">
      <span class="pill" x-text="m.kind"></span>
      <h1 style="margin-top:8px" x-text="m.title"></h1>
      <div class="muted" x-text="m.exam"></div>
      <div class="facts">
        <div><b x-text="totalQ()"></b><span class="muted" x-text="L.questions"></span></div>
        <div><b x-text="m.marks"></b><span class="muted" x-text="L.marks"></span></div>
        <div><b x-text="m.minutes"></b><span class="muted" x-text="L.minutes"></span></div>
      </div>
      <div class="table-wrap"><table>
        <tr><th x-text="L.section"></th><th x-text="L.questions"></th><th x-text="L.marksEach"></th><th x-text="L.negative"></th></tr>
        <template x-for="s in m.sections"><tr><td x-text="s.subject"></td><td x-text="s.questions"></td><td x-text="s.marks"></td><td x-text="s.negative ? '−' + s.negative : '—'"></td></tr></template>
      </table></div>
      <div class="muted" x-show="m.note" x-text="m.note" style="margin-top:8px"></div>
      <ul class="muted" x-show="m.instructions.length"><template x-for="i in m.instructions"><li x-text="i"></li></template></ul>
      <div style="max-width:420px">
        <label x-text="m.access==='signup' ? L.name : L.nameOpt"></label><input x-model="form.name" autocomplete="name" maxlength="60">
        <template x-if="m.access==='signup'"><div>
          <label x-text="L.phone"></label><input x-model="form.phone" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="98xxxxxxxx">
          <label x-text="L.email"></label><input x-model="form.email" type="email" autocomplete="email" maxlength="120">
          <p class="muted" x-text="L.privacy"></p>
        </div></template>
        <div class="row" style="margin-top:14px">
          <button class="btn primary" @click="start()" :disabled="busy" x-text="busy ? '…' : (resumable ? L.resume : L.start)"></button>
          <button class="btn" x-show="resumable" @click="discard()" x-text="L.restart"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- test -->
  <template x-if="phase==='test' && q()">
    <div class="layout">
      <div>
        <div class="tabs"><template x-for="s in m.sections"><button :class="q().section===s.subject && 'on'" @click="goSection(s.subject)" x-text="s.subject"></button></template></div>
        <div class="card">
          <div class="qhead"><span x-text="L.q + ' ' + q().n + ' / ' + qs.length"></span><span x-text="q().section"></span><span x-show="q().ref" :class="q().practice && 'practice'" x-text="q().ref"></span></div>
          <div class="stem" x-text="q().question"></div>
          <div class="fig" x-show="q().svg"><img :src="q().svg" alt="figure"></div>
          <div x-show="q().hint" style="margin-bottom:10px">
            <button class="btn" x-show="!hinted[q().id]" @click="showHint()" x-text="'💡 ' + L.showHint"></button>
            <div class="hint" x-show="hinted[q().id]"><b x-text="'💡 ' + L.hint"></b> <span x-text="q().hint"></span></div>
          </div>
          <template x-for="(o, j) in q().options"><button class="opt" :class="answers[q().id]===j && 'on'" @click="choose(j)">
            <span class="l" x-text="letter(j)"></span><span x-text="o"></span></button></template>
          <div class="row" style="justify-content:space-between; margin-top:6px">
            <div class="row">
              <button class="btn" @click="toggleMark()" x-text="marked[q().id] ? L.unmark : L.mark"></button>
              <button class="btn" @click="clear()" x-text="L.clear"></button>
            </div>
            <div class="row">
              <button class="btn" @click="go(cur-1)" :disabled="cur===0" x-text="L.prev"></button>
              <button class="btn primary" @click="go(cur+1)" :disabled="cur===qs.length-1" x-text="L.next"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="side card">
        <div class="row" style="justify-content:space-between; margin-bottom:8px"><b x-text="L.palette"></b><span class="muted" x-text="answeredCount() + ' / ' + qs.length"></span></div>
        <div class="palette"><template x-for="(x, i) in qs"><button :class="paletteClass(x, i)" @click="go(i)" x-text="x.n"></button></template></div>
        <div class="legend"><span><i style="background:var(--ok)"></i><span x-text="L.answered"></span></span><span><i style="background:#7b4ed6"></i><span x-text="L.marked"></span></span>
          <span><i class="seen" style="background:color-mix(in srgb,var(--bad) 15%,var(--panel))"></i><span x-text="L.notAnswered"></span></span><span><i></i><span x-text="L.notVisited"></span></span></div>
        <button class="btn primary" style="width:100%; margin-top:12px" @click="confirmSubmit()" x-text="L.submit"></button>
      </div>
    </div>
  </template>

  <!-- result -->
  <template x-if="phase==='result'">
    <div>
      <div class="card">
        <h1 x-text="m.title"></h1>
        <div class="facts">
          <div><span class="muted" x-text="L.score"></span><b class="big" x-text="res.score + ' / ' + res.max_score"></b></div>
          <div><span class="muted" x-text="L.rank"></span><b x-text="res.rank + ' / ' + res.attempts"></b></div>
          <div><span class="muted" x-text="L.percentile"></span><b x-text="res.percentile"></b></div>
          <div><span class="muted" x-text="L.accuracy"></span><b x-text="res.accuracy + '%'"></b></div>
        </div>
        <div class="row muted"><span class="status-correct" x-text="'✔ ' + res.correct + ' ' + L.correct"></span>·<span class="status-wrong" x-text="'✘ ' + res.wrong + ' ' + L.wrong"></span>·<span x-text="res.skipped + ' ' + L.skipped"></span>·<span x-text="L.time + ' ' + mmss(spent)"></span><span x-show="hintCount()" x-text="'· 💡 ' + hintCount() + ' ' + L.hintsUsed"></span></div>
        <div class="table-wrap" style="margin-top:10px"><table>
          <tr><th x-text="L.section"></th><th x-text="L.score"></th><th x-text="L.correct"></th><th x-text="L.wrong"></th><th x-text="L.skipped"></th></tr>
          <template x-for="s in res.sections"><tr><td x-text="s.subject"></td><td x-text="s.score + ' / ' + s.max"></td><td x-text="s.correct"></td><td x-text="s.wrong"></td><td x-text="s.skipped"></td></tr></template>
        </table></div>
        <div style="margin-top:12px" x-show="res.next.length"><b x-text="L.nextTests"></b>
          <div class="row" style="margin-top:6px"><template x-for="t in res.next"><a class="btn" :href="'/t/' + m.series + '/' + t.id" x-text="t.title"></a></template>
            <a class="btn" :href="'/t/' + m.series" x-text="L.allTests"></a></div></div>
      </div>
      <h2 x-text="L.solutions"></h2>
      <div class="tabs"><template x-for="f in ['all','wrong','skipped','correct']"><button :class="filter===f && 'on'" @click="filter=f" x-text="L['f_' + f]"></button></template></div>
      <template x-for="r in res.review.filter(r => filter==='all' || r.status===filter)" :key="r.id">
        <div class="card">
          <div class="qhead"><span x-text="L.q + ' ' + r.n"></span><span :class="'status-' + r.status" x-text="L[r.status]"></span></div>
          <div class="stem" x-text="byId[r.id].question"></div>
          <div class="fig" x-show="byId[r.id].svg"><img :src="byId[r.id].svg" alt="figure"></div>
          <template x-for="(o, j) in byId[r.id].options"><div class="opt" :class="j===r.correct ? 'right' : (j===r.chosen ? 'wrong' : '')">
            <span class="l" x-text="letter(j)"></span><span x-text="o"></span></div></template>
          <div class="hint" x-show="r.hint"><b x-text="'💡 ' + L.hint + (hinted[r.id] ? ' (' + L.used + ')' : '')"></b> <span x-text="r.hint"></span></div>
          <div class="sol"><b x-text="L.solution"></b><div x-text="r.solution"></div></div>
          <template x-if="r.explanation"><details class="explain" :open="r.status!=='correct'">
            <summary x-text="L.explanation"></summary><div x-text="r.explanation"></div></details></template>
        </div>
      </template>
    </div>
  </template>
</main>
</body></html>
